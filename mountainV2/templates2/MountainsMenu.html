<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montañas</title>
    <script defer src="../statics2/js/script2.js"></script>
    <script defer src="../statics2/js/mountain.js"></script>
    <script defer src="../statics2/js/comentarios.js"></script>
    <link rel="stylesheet" href="../statics2/css/styles.css">
    <style>
        .mountain-card {
          background: white;
          border-radius: 1rem;
          overflow: hidden;
          margin-bottom: 1.5rem;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
      
        .mountain-card:hover {
          transform: translateY(-4px);
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
      
        .mountain-info {
          padding: 1.5rem;
        }
      
        .mountain-image-container {
          position: relative;
          height: 240px;
          overflow: hidden;
        }
      
        .mountain-image {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: transform 0.3s ease;
        }
      
        .mountain-card:hover .mountain-image {
          transform: scale(1.05);
        }
      </style>
</head>
<body>


    <!-- Contenido principal -->
    <main id="main-content">
     

        <div id="mountainContainer"></div>



    </main>
</body>
</html>
