<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montañas</title>
    <script defer src="../statics2/js/script2.js"></script>
    <script defer src="../statics2/js/mountain.js"></script>
    <script defer src="../statics2/js/comentarios.js"></script>
    <link rel="stylesheet" href="../statics2/css/styles.css">
    <style>
    .mountain-card {
        background: white;
        border-radius: 1.5rem;
        overflow: hidden;
        margin-bottom: 2rem;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        border: 1px solid rgba(255,255,255,0.2);
    }

    .mountain-image-container {
        position: relative;
        height: 300px;
        overflow: hidden;
    }

    .mountain-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .mountain-info {
        padding: 2rem;
        background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,1) 100%);
    }

    .mountain-info h2 {
        color: var(--primary-color);
        font-size: 1.5rem;
        margin-bottom: 1rem;
    }

    .mountain-details {
        display: flex;
        gap: 1.5rem;
        margin-bottom: 1rem;
    }

    .detail-item {
        display: flex;
        align-items: center;
        color: var(--text-dark);
        font-size: 0.9rem;
    }

    .mountain-type {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: var(--accent-color);
        color: var(--primary-color);
        border-radius: 2rem;
        font-size: 0.875rem;
        font-weight: 500;
    }

    .mountain-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    }

    .mountain-card:hover .mountain-image {
        transform: scale(1.1);
    }
    </style>
    
</head>
<body>


    <!-- Contenido principal -->
    <main id="main-content">
     

        <div id="mountainContainer"></div>



    </main>
</body>
</html>
