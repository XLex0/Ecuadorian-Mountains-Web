<!-- register.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../statics2/css/styles.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-box">
            <h2>Registro</h2>
            <form id="formRegister" action="../configBD/auth.php" method="POST">
                <label for="fullname">Nombre Completo:</label>
                <input type="text" id="fullname" name="fullname" required>
                
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tiene una cuenta? <a href="login.html">Inicie sesión aquí</a></p>
        </div>
    </main>
    <script>
    document.getElementById('formRegister').addEventListener('submit', function(e) {
        e.preventDefault();
        
        fetch('../configBD/auth.php', {
            method: 'POST',
            body: new FormData(this)
        })
        .then(response => response.text())
        .then(data => {
            if (data.includes('ya están registrados')) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = 'El usuario o correo ya están registrados';
                document.querySelector('.auth-box').insertBefore(errorDiv, document.querySelector('form'));
                
                setTimeout(() => errorDiv.remove(), 3000);
            } else {
                window.location.href = 'login.html';
            }
        })
        .catch(error => console.error('Error:', error));
    });
    </script>
</body>
</html>
