<!-- login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../statics2/css/styles.css">
    <script src="../statics2/js/comentarios.js"></script>
</head>
<body>
    <main class="auth-container">
        <div class="auth-box">
            <h2>Iniciar Sesión</h2>
            <form id="formLogin" action="../configBD/login.php" method="POST">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit">Ingresar</button>
            </form>            
            <p>¿No tiene cuenta? <a href="register.html">Regístrese aquí</a></p>
        </div>
    </main>
    <script>
    document.getElementById('formLogin').addEventListener('submit', function(e) {
        e.preventDefault();
        
        fetch('../configBD/login.php', {
            method: 'POST',
            body: new FormData(this)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'ok') {
                window.location.href = data.redirect;
            } else {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = 'Usuario o contraseña incorrectos';
                document.querySelector('.auth-box').insertBefore(errorDiv, document.querySelector('form'));
                
                setTimeout(() => errorDiv.remove(), 3000);
            }
        })
        .catch(error => console.error('Error:', error));
    });
    </script>
</body>
</html>
