<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montañas</title>
    <script defer src="../statics2/js/mountain.js"></script>
    <script defer src="../statics2/js/comentarios.js"></script>
    <link rel="stylesheet" href="../statics2/css/styles.css">
</head>
<body>
    <main id="main-content">
        <section class="info-container">
            <h1 id="mountainName" class="mountain-title"></h1>
            <div id="imagenContainer" class="image-box">
                <img id="mountainImage" src="" alt="Imagen de Montaña">
            </div>
        </section>

        <section class="info-container">
            <h2>Información Relevante</h2>
            <p id="descripcion" class="descripcion-texto"></p>
        </section>

        <section class="info-container">
            <h2>Detalles</h2>
            <ul id="detalles" class="detalle-lista">
                <li>🌍 Longitud: <span id="longitud"></span></li>
                <li>🌍 Latitud: <span id="latitud"></span></li>
                <li>📍 Ubicación: <span id="ubicacion"></span></li>
                <li>⛰️ Altura: <span id="altura"></span></li>
                <li>🗻 Tipo: <span id="tipo"></span></li>
            </ul>
        </section>

        <section class="info-container">
            <h2>Ubicación</h2>
            <div id="map"></div>
        </section>

        <!-- Nueva sección de comentarios -->
        <section class="info-container comments-section">
            <h2>Deja tu opinión</h2>
            <div class="rating-stars">
                <div class="stars" id="stars-container">
                    <i class="fas fa-star" data-rating="1"></i>
                    <i class="fas fa-star" data-rating="2"></i>
                    <i class="fas fa-star" data-rating="3"></i>
                    <i class="fas fa-star" data-rating="4"></i>
                    <i class="fas fa-star" data-rating="5"></i>
                </div>
                <input type="hidden" id="rating-value" value="0">
            </div>
        
            <textarea id="comentario-texto" class="comentario-input animate-input" 
                      placeholder="Comparte tu experiencia..." rows="4"></textarea>
        
            <div class="comment-user-status">
                <div id="userStatus" class="user-status">
                    <!-- Se llenará dinámicamente vía JavaScript -->
                </div>
            </div>
        
            <button id="submit-comentario" class="btn-comentar">
                <i class="fas fa-paper-plane"></i> Enviar comentario
            </button>
        </div>
        </section>
        
        <style>
        .comment-user-status {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            background: #f8f9fa;
            text-align: center;
        }
        
        .user-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9em;
        }
        
        .user-status a {
            color: var(--primary-color);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(47, 133, 90, 0.1);
        }
        
        .user-status a:hover {
            background: rgba(47, 133, 90, 0.2);
        }
        </style>
        </section>

        <section class="info-container">
            <h2>Comentarios y Valoraciones</h2>
            <div class="comentarios-wrapper">
                <table class="comentarios-table">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Comentario</th>
                            <th>Calificación</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="comentarios">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
